[project]
name = "steerable-canvas"
version = "0.1.0"
description = "Streaming backend for realtime LLM steering: dials, attention locks, scrubbing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
# Tier B (activation steering) and the proxy-model focus monitor
local = ["torch>=2.2", "transformers>=4.44", "tokenizers>=0.19", "numpy>=1.26"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
steerable-server = "steerable.server:main"
steerable-replay = "steerable.replay:main"
steerable-vectors = "steerable.vectors:main"
steerable-abtest = "steerable.abtest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["steerable*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: trains a small model; a few minutes on CPU"]
